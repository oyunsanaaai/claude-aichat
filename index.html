<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oyunsanaa · Claude (Private)</title>
<style>
  body{font-family:system-ui,Arial;background:#0f1220;color:#e9edf5;margin:0}
  .wrap{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header{padding:14px 16px;border-bottom:1px solid #24304a;background:#11162a;position:sticky;top:0}
  #chat{flex:1;overflow:auto;padding:16px}
  .row{display:flex;gap:8px;padding:12px;background:#11162a;border-top:1px solid #24304a}
  textarea{flex:1;min-height:44px;max-height:180px;resize:none;border:1px solid #2a3654;background:#0f1428;color:#e9edf5;border-radius:10px;padding:10px}
  button{border:0;background:#0d74ff;color:#fff;border-radius:10px;padding:0 16px;font-weight:600}
  .msg{white-space:pre-wrap;word-wrap:break-word;background:#162042;border:1px solid #27365a;border-radius:12px;padding:10px;margin:8px 0}
  .me{background:#0d74ff;border-color:#2a66ff}
  .muted{opacity:.7;font-size:12px}
</style>

<div class="wrap">
  <header>
    <b>Oyunsanaa · Claude</b>
    <div class="muted">Энэ хуудас зөвхөн туршилт — API KEY чинь Worker дээр хадгалагдсан байх ёстой</div>
  </header>

  <main id="chat"></main>

  <div class="row">
    <textarea id="inp" placeholder="Мессеж бичээд Enter (Shift+Enter = шинэ мөр)"></textarea>
    <button id="send">Илгээх</button>
  </div>
</div>

<script>
  // 🔗 ЭНД ӨӨРИЙН WORKER ЭНДПОИНТЫГ ТАВИНА:
  const API = "https://claude-chat.oyunsanaa-ai.workers.dev/api/claude"; // ← зөвхөн энэ мөрийг солино
  // Хэрвээ Worker дээр нууц токен шалгадаг бол доороо бөглөнө:
  const SECRET_TOKEN = ""; // ж: "oyunsanaa123!" (Worker-тэйгээ таарч байх ёстой)

  const chat = document.getElementById('chat');
  const inp  = document.getElementById('inp');
  const btn  = document.getElementById('send');
  const history = [];

  function add(text, mine=false){
    const div = document.createElement('div');
    div.className = 'msg' + (mine ? ' me' : '');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  function setTyping(on){
    if(on){
      const d=document.createElement('div'); d.id='typing'; d.className='muted'; d.textContent='🤖 бичиж байна...';
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    }else{
      const t=document.getElementById('typing'); if(t) t.remove();
    }
  }

  async function send(){
    const text = inp.value.trim();
    if(!text) return;
    add("👤 " + text, true);
    inp.value = "";
    setTyping(true);
    try{
      const res = await fetch(API, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          ...(SECRET_TOKEN ? {"x-auth": SECRET_TOKEN} : {})
        },
        body: JSON.stringify({ message: text, history })
      });
      // Хариу JSON биш бол текстээр нь харуулчихъя
      const ct = res.headers.get("content-type")||"";
      let data, reply;
      if (ct.includes("application/json")) {
        data  = await res.json();
        reply = (data && data.content && data.content[0] && data.content[0].text) ? data.content[0].text : JSON.stringify(data);
      } else {
        reply = await res.text();
      }
      setTyping(false);
      add("🤖 " + reply);
      history.push({ role: "user",      content: text  });
      history.push({ role: "assistant", content: reply });
    }catch(e){
      setTyping(false);
      add("❌ Алдаа: " + e);
    }
  }

  btn.onclick = send;
  inp.addEventListener('keydown', e=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
</script>
